name: Refresh feeds

# Runs every night and on demand. Downloads CISA KEV + FIRST EPSS + NVD CVSS,
# writes compact snapshots into /data, and commits them back to the repo.
on:
  schedule:
    - cron: '17 4 * * *'        # daily ~04:17 UTC
  workflow_dispatch: {}          # lets you run it manually from the Actions tab

permissions:
  contents: write                # needed to commit the refreshed /data files

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build snapshots
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}   # optional; faster CVSS sync if set
        run: python scripts/enrich.py

      - name: Commit snapshots
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "data: refresh feeds $(date -u +%F)"
          git push
